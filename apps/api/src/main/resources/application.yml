spring:
  application:
    name: postflow-api
  # Local dev: drop keys into apps/api/.env (gitignored). Auto-imported as properties.
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: postflow
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: postflow
    create-schemas: true
    default-schema: postflow
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 110MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 에러 모니터링 — SENTRY_DSN 미설정 시 완전 비활성(no-op). DSN은 배포 env로만 주입.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:local}
  traces-sample-rate: 0.1
  send-default-pii: false

ai:
  provider: ${AI_PROVIDER:claude}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    models:
      LIGHT: claude-haiku-4-5
      STANDARD: claude-sonnet-4-6
      PREMIUM: claude-opus-4-8

shopping-shorts:
  live-api-enabled: ${SHOPPING_SHORTS_LIVE_API_ENABLED:false}
  planning:
    provider: ${SHOPPING_SHORTS_PLANNING_PROVIDER:mock}
  storyboard:
    provider: ${SHOPPING_SHORTS_STORYBOARD_PROVIDER:mock}
  video:
    provider: ${SHOPPING_SHORTS_VIDEO_PROVIDER:mock}
  tts:
    provider: ${SHOPPING_SHORTS_TTS_PROVIDER:mock}
    say-path: ${SHOPPING_SHORTS_TTS_SAY_PATH:/usr/bin/say}
    voice: ${SHOPPING_SHORTS_TTS_VOICE:}
    rate: ${SHOPPING_SHORTS_TTS_RATE:185}
    openai:
      api-key: ${SHOPPING_SHORTS_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      endpoint: ${SHOPPING_SHORTS_OPENAI_TTS_ENDPOINT:https://api.openai.com/v1/audio/speech}
      model: ${SHOPPING_SHORTS_OPENAI_TTS_MODEL:gpt-4o-mini-tts}
      voice: ${SHOPPING_SHORTS_OPENAI_TTS_VOICE:verse}
  render:
    provider: ${SHOPPING_SHORTS_RENDER_PROVIDER:mock}
  quality:
    provider: ${SHOPPING_SHORTS_QUALITY_PROVIDER:local-file}
  ffmpeg:
    path: ${SHOPPING_SHORTS_FFMPEG_PATH:/opt/homebrew/bin/ffmpeg}
    font-path: ${SHOPPING_SHORTS_FFMPEG_FONT_PATH:/System/Library/Fonts/AppleSDGothicNeo.ttc}
  ffprobe:
    path: ${SHOPPING_SHORTS_FFPROBE_PATH:/opt/homebrew/bin/ffprobe}
  kling:
    api-key: ${SHOPPING_SHORTS_KLING_API_KEY:${KLING_API_KEY:}}
    access-key: ${SHOPPING_SHORTS_KLING_ACCESS_KEY:${KLING_ACCESS_KEY:}}
    secret-key: ${SHOPPING_SHORTS_KLING_SECRET_KEY:${KLING_SECRET_KEY:}}
    base-url: ${SHOPPING_SHORTS_KLING_BASE_URL:${KLING_BASE_URL:https://api-singapore.klingai.com}}
    model: ${SHOPPING_SHORTS_KLING_MODEL:${KLING_MODEL:kling-v2.1}}
    mode: ${SHOPPING_SHORTS_KLING_MODE:${KLING_MODE:std}}
    text-to-video-path: ${SHOPPING_SHORTS_KLING_TEXT_TO_VIDEO_PATH:${KLING_TEXT_TO_VIDEO_PATH:/v1/videos/text2video}}
    image-to-video-path: ${SHOPPING_SHORTS_KLING_IMAGE_TO_VIDEO_PATH:${KLING_IMAGE_TO_VIDEO_PATH:/v1/videos/image2video}}
    task-status-path: ${SHOPPING_SHORTS_KLING_TASK_STATUS_PATH:${KLING_TASK_STATUS_PATH:}}
    text-to-video-status-path: ${SHOPPING_SHORTS_KLING_TEXT_TO_VIDEO_STATUS_PATH:${KLING_TEXT_TO_VIDEO_STATUS_PATH:/v1/videos/text2video/{taskId}}}
    image-to-video-status-path: ${SHOPPING_SHORTS_KLING_IMAGE_TO_VIDEO_STATUS_PATH:${KLING_IMAGE_TO_VIDEO_STATUS_PATH:/v1/videos/image2video/{taskId}}}

# synub 통합 시스템 연동(office 컨벤션과 동일). 로그인=SSO 토큰 검증, 구독=중앙 빌링.
synub:
  sso:
    # RS256 토큰은 base-url의 JWKS(base-url + /.well-known/jwks.json)로 검증.
    base-url: ${SYNUB_SSO_BASE_URL:http://localhost:8090}
    issuer: ${SYNUB_SSO_ISSUER:https://accounts.synub.io}
    audience: ${SYNUB_SSO_AUDIENCE:synub-postflow}
  billing:
    # 결제는 post-flow가 하지 않고, 웹훅 수신·entitlements 조회만.
    base-url: ${SYNUB_BILLING_BASE_URL:http://localhost:8088}
    service-code: ${SYNUB_BILLING_SERVICE_CODE:post-flow}
    # 빌링의 SERVICE_API_KEY와 동일. 웹훅 시크릿은 빌링 app.webhook.secret과 동일.
    service-key: ${SYNUB_BILLING_SERVICE_KEY:local-service-key}
    webhook-secret: ${SYNUB_BILLING_WEBHOOK_SECRET:local-dev-webhook-secret}
    portal-url: ${SYNUB_BILLING_PORTAL_URL:https://app.synub.io}

auth:
  # Threads OAuth state 서명용(내부 전용). 로그인용 아님.
  state-secret: ${AUTH_STATE_SECRET:dev-only-insecure-state-secret-change-me-32b!}
  # 비공개 베타 접근 허용목록(external_id, 쉼표구분). 오픈 전이라 이 계정들만 로그인 가능.
  # 데모 계정(demo-user)은 이와 별개로 항상 허용(읽기전용 체험). 공개 시 빈 값으로 두면 전체 허용.
  # haru=usr_admin_haru, sky=usr_office_sky, admin=usr_office_admin
  allowed-external-ids: ${AUTH_ALLOWED_EXTERNAL_IDS:usr_admin_haru,usr_office_sky,usr_office_admin}

threads:
  app-id: ${THREADS_APP_ID:}
  app-secret: ${THREADS_APP_SECRET:}
  redirect-uri: ${THREADS_REDIRECT_URI:http://localhost:8080/threads/callback}
  # threads_read_replies = 답글 '읽기'(댓글 뷰어·자동화 키워드 감지), threads_manage_replies = 답글 '관리'(숨김·답장).
  # 둘은 별개 권한 — 읽기만 하려 해도 read_replies 없으면 code10(permission denied). basic 제외 검수 대상.
  # Instagram 교차게시는 Threads API 파라미터로 불가(share_to_instagram 없음) → 별도 IG Graph API 통합 필요.
  #   docs/SNS_ROADMAP.md Phase 4 참조. 여기 scope엔 포함하지 않는다.
  # threads_profile_discovery(타인 공개 프로필 조회=경쟁사 분석)는 앱검수 거부(2026-07: 스크린캐스트 불일치).
  #   미승인 scope를 OAuth에 넣으면 일반 사용자 로그인이 깨질 수 있어 승인 전까지 제외. 재승인 시 다시 추가.
  scopes: threads_basic,threads_content_publish,threads_manage_insights,threads_read_replies,threads_manage_replies,threads_keyword_search,threads_manage_mentions,threads_delete
  authorize-base-url: https://threads.net
  graph-base-url: https://graph.threads.net
  frontend-redirect-url: ${THREADS_FRONTEND_REDIRECT_URL:http://localhost:5173/settings/threads?threads=connected}
  publisher:
    interval-ms: 60000
  token-refresh:
    cron: "0 0 3 * * *"

linkedin:
  # LinkedIn Developer 앱: "Sign In with LinkedIn using OpenID Connect" + "Share on LinkedIn" 제품 승인 필요.
  # 크레덴셜은 키 일괄 투입 전까지 빈 값(연결 시도 시 authorizeUrl에 client_id 없어 실패 → 정상, UI는 렌더).
  client-id: ${LINKEDIN_CLIENT_ID:}
  client-secret: ${LINKEDIN_CLIENT_SECRET:}
  redirect-uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/linkedin/callback}
  # w_member_social = 회원 피드 발행/삭제. 개인 프로필 게시물/분석 '읽기'는 파트너 승인 필요 → 미포함(발행 전용).
  # 조직(회사 페이지) 발행: Community Management API 승인 후 LINKEDIN_SCOPES에 r_organization_admin·w_organization_social 추가.
  #   승인 안 된 scope를 넣으면 OAuth가 깨지므로 기본은 personal만. 조직 채널 조회는 코드상 best-effort(스코프 없으면 403→스킵).
  scopes: ${LINKEDIN_SCOPES:openid profile w_member_social}
  authorize-base-url: https://www.linkedin.com
  api-base-url: https://api.linkedin.com
  restli-version: "202401"
  frontend-redirect-url: ${LINKEDIN_FRONTEND_REDIRECT_URL:http://localhost:5173/settings/threads?linkedin=connected}

facebook:
  # Meta 앱: Facebook 로그인 + pages_manage_posts·pages_show_list·pages_read_engagement 검수 필요.
  # Threads 앱과 별개 크레덴셜. 크레덴셜 미설정 시 authorizeUrl에 client_id 없어 실제 연결은 안 됨(UI는 렌더).
  app-id: ${FACEBOOK_APP_ID:}
  app-secret: ${FACEBOOK_APP_SECRET:}
  redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:8080/facebook/callback}
  # Instagram 발행까지 켜려면 검수 승인 후 FACEBOOK_SCOPES에 instagram_basic,instagram_content_publish 추가.
  #   기본은 페이지만(미승인 scope 넣으면 OAuth 깨짐). IG 계정 감지는 코드상 best-effort(스코프 없으면 감지 안 됨→스킵).
  scopes: ${FACEBOOK_SCOPES:pages_show_list,pages_manage_posts,pages_read_engagement}
  graph-base-url: https://graph.facebook.com
  dialog-base-url: https://www.facebook.com
  api-version: v21.0
  frontend-redirect-url: ${FACEBOOK_FRONTEND_REDIRECT_URL:http://localhost:5173/settings/threads?facebook=connected}

instagram:
  # "Instagram API with Instagram login" — 페이스북 페이지 없이 IG 비즈니스/크리에이터 계정을 직접 연결.
  # Meta 앱 > Instagram > "Instagram 로그인 API 설정"의 인스타그램 앱 ID/시크릿(페북·Threads 앱과 별개).
  # 미설정 시 authorizeUrl에 client_id 없어 실제 연결은 안 됨(UI는 렌더).
  app-id: ${INSTAGRAM_APP_ID:}
  app-secret: ${INSTAGRAM_APP_SECRET:}
  redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:8080/instagram/callback}
  # 개인 계정은 발행 불가 → 비즈니스/크리에이터 계정만 실제 동작(연결 시 account_type 검사).
  scopes: ${INSTAGRAM_SCOPES:instagram_business_basic,instagram_business_content_publish,instagram_business_manage_comments,instagram_business_manage_insights}
  authorize-base-url: https://www.instagram.com
  graph-base-url: https://graph.instagram.com
  api-base-url: https://api.instagram.com
  api-version: v21.0
  frontend-redirect-url: ${INSTAGRAM_FRONTEND_REDIRECT_URL:http://localhost:5173/settings/threads?instagram=connected}

naver:
  # 네이버 오픈API(검색) — 제휴 콘텐츠 작성 시 실제 상품 정보(제목·브랜드·카테고리·가격·이미지)를 근거로 끌어옴.
  # 네이버 개발자센터(developers.naver.com) > 애플리케이션 등록 > "검색" API 사용 설정 후 발급.
  # 미설정 시 상품 검색만 비활성(다른 기능 무관).
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}
  search-base-url: https://openapi.naver.com
